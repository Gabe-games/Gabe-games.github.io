<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gabe Games</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: "Bebas Neue", sans-serif;
        }

        .intro {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            background: #000;

            opacity: 1;

            transition: opacity 1s ease;
        }

        /* RED GLOW */

        .glow {
            position: absolute;

            width: 600px;
            height: 600px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(180, 0, 0, 0.55) 0%,
                    rgba(120, 0, 0, 0.25) 35%,
                    rgba(0, 0, 0, 0) 70%
                );

            opacity: 0;

            animation: glowFade 2s ease forwards;

            animation-delay: 1.2s;
        }

        /* TITLE */

        h1 {
            position: relative;

            margin: 0;

            color: white;

            font-size: clamp(70px, 12vw, 160px);

            letter-spacing: 6px;

            opacity: 0;

            text-shadow:
                0 0 15px rgba(255, 0, 0, 0.35);

            animation: titleFade 1.5s ease forwards;

            animation-delay: 2s;
        }

        /* SLOGAN */

        .slogan {
            position: relative;

            margin-top: 5px;

            color: #d81f1f;

            font-size: clamp(24px, 4vw, 45px);

            letter-spacing: 3px;

            opacity: 0;

            animation: sloganFade 1.5s ease forwards;

            animation-delay: 4s;
        }

        /* HOME BUTTON */

        .homeButton {
            position: relative;

            margin-top: 40px;

            padding: 12px 50px;

            border: 2px solid #c51d1d;

            background: transparent;

            color: white;

            font-family: "Bebas Neue", sans-serif;

            font-size: 28px;

            letter-spacing: 2px;

            cursor: pointer;

            opacity: 0;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;

            animation: buttonFade 1.5s ease forwards;

            animation-delay: 5.2s;
        }

        .homeButton:hover {
            background: #c51d1d;

            transform: scale(1.05);
        }

        /* EXIT FADE */

        .intro.fadeOut {
            opacity: 0;
        }

        /* ANIMATIONS */

        @keyframes glowFade {

            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes titleFade {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes sloganFade {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes buttonFade {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

    </style>
</head>

<body>

    <main class="intro" id="intro">

        <div class="glow"></div>

        <h1>GABE GAMES</h1>

        <div class="slogan">
            BY A GAMER. FOR GAMERS.
        </div>

        <button class="homeButton" id="homeButton">
            HOME
        </button>

    </main>

    <script>

        const intro = document.getElementById("intro");
        const homeButton = document.getElementById("homeButton");

        homeButton.addEventListener("click", function () {

            intro.classList.add("fadeOut");

            setTimeout(function () {

                window.location.href = "home.html";

            }, 1000);

        });

    </script>

</body>

</html>
