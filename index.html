<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gabe Games</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

header{
    background:#8B0000;
    padding:30px;
    text-align:center;
}

h1{
    margin:0;
    font-size:48px;
}

p{
    color:#ddd;
}

.games{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    padding:40px;
}

.card{
    background:#1d1d1d;
    width:300px;
    padding:20px;
    border-radius:15px;
    border:2px solid #8B0000;
    transition:.3s;
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px red;
}

button{
    background:#b00000;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:red;
}

footer{
    text-align:center;
    padding:20px;
    color:gray;
}

</style>

</head>

<body>

<header>

<h1>🎮 Gabe Games</h1>

<p>Making games one project at a time.</p>

</header>

<section class="games">

<div class="card">
<h2>🏨 Motel Sleep</h2>
<p>A creepy indoor motel survival horror game.</p>
<button>Coming Soon</button>
</div>

<div class="card">
<h2>🗳️ Trump Clicker</h2>
<p>Click your way to victory and unlock upgrades!</p>
<button>In Active Development</button>
</div>

<div class="card">
<h2>🏹 Hunger Games Fan Project</h2>
<p>A fan-made Hunger Games experience.</p>
<button>Planning</button>
</div>

</section>

<footer>

© 2026 Gabe Games

</footer>

</body>
</html>
